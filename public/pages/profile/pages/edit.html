<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Edit Profile — Beltline Cloud</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="icon" href="/assets/img/cloud/cloud-logo.jpg">
  <link rel="stylesheet" href="/pages/profile/css/profile.css">
</head>

<body data-page="edit-profile">

  <header class="profile-topbar">
    <img src="/assets/img/cloud/cloud-logo.jpg" class="top-logo" onclick="location.href='/pages/profile/pages/index.html'">
    <h2>Edit Profile</h2>
  </header>

  <main class="edit-container">

    <section class="edit-section">
      <h3>Avatar</h3>
      <img id="editAvatarPreview" class="avatar-img" src="/assets/img/cloud/default-avatar.jpg">
      <input type="file" id="editAvatar" accept="image/*">
    </section>

    <section class="edit-section">
      <h3>Header</h3>
      <img id="editHeaderPreview" class="header-img" src="/assets/img/cloud/default-header.jpg">
      <input type="file" id="editHeader" accept="image/*">
    </section>

    <section class="edit-section">
      <h3>Profile Info</h3>
      <label>Display Name</label>
      <input id="editDisplayName">

      <label>Username</label>
      <input id="editUsername">

      <label>Bio</label>
      <textarea id="editBio"></textarea>
    </section>

    <section class="edit-section">
      <h3>Social Links</h3>
      <label>TikTok</label>
      <input id="editTikTok">

      <label>Instagram</label>
      <input id="editInstagram">

      <label>Facebook</label>
      <input id="editFacebook">

      <label>Website</label>
      <input id="editWebsite">
    </section>

    <section class="edit-section">
      <h3>Preferences</h3>
      <label>Feed Preference</label>
      <select id="editFeedPref">
        <option value="beltline">Beltline First</option>
        <option value="global">Global First</option>
      </select>

      <label>Chatroom Access</label>
      <select id="editChatPref">
        <option value="beltline">Beltline + Global</option>
        <option value="global">Global Only</option>
      </select>

      <label>Call Settings</label>
      <select id="editCallPref">
        <option value="everyone">Everyone</option>
        <option value="friends">Friends Only</option>
        <option value="none">No Calls</option>
      </select>
    </section>

    <div class="edit-actions">
      <button id="saveEditBtn" class="primary-btn">Save Changes</button>
      <button id="cancelEditBtn" class="secondary-btn">Cancel</button>
    </div>

  </main>

  <script type="module" src="/pages/profile/js/edit.js"></script>
</body>
</html>
