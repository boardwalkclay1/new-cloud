<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Cloud Profile — Beltline Cloud</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="icon" href="/assets/img/cloud/cloud-logo.jpg">
  <link rel="stylesheet" href="/pages/profile/css/profile.css">
</head>

<body data-page="cloud-profile">

  <!-- TOP BAR -->
  <header class="profile-topbar">
    <div class="top-left">
      <img src="/assets/img/cloud/cloud-logo.jpg" class="top-logo" id="openMenu">
      <div class="top-info">
        <div id="topTime"></div>
        <div id="topDate"></div>
        <div id="topZone"></div>
      </div>
    </div>

    <div class="top-right">
      <img src="/assets/img/cloud/message-icon.png" class="msg-icon" id="openMessages">
    </div>
  </header>

  <!-- HIDDEN LOGO MENU -->
  <div id="logoMenu" class="logo-menu hidden">
    <button data-action="edit">Edit Profile</button>
    <button data-action="settings">Profile Settings</button>
    <button data-action="network">Network</button>
    <button data-action="chatrooms">Chatrooms</button>
    <button data-action="messages">Messages</button>
    <button data-action="calls">Calls</button>
    <button data-action="events">Events</button>
    <button data-action="fastroll">Fast Roll</button>
    <button data-action="logout">Logout</button>
  </div>

  <!-- MAIN PROFILE -->
  <main class="profile-container">

    <!-- HEADER -->
    <section class="header-section">
      <img id="headerImage" class="header-img" src="/assets/img/cloud/default-header.jpg">
    </section>

    <!-- USER CARD -->
    <section class="user-card">
      <img id="avatarImage" class="avatar-img" src="/assets/img/cloud/default-avatar.jpg">

      <h1 id="displayName">Display Name</h1>
      <p id="username">@username</p>
      <p id="bio">Bio goes here…</p>

      <div class="social-links">
        <a id="linkTikTok" target="_blank">TikTok</a>
        <a id="linkInstagram" target="_blank">Instagram</a>
        <a id="linkFacebook" target="_blank">Facebook</a>
        <a id="linkWebsite" target="_blank">Website</a>
      </div>

      <div class="stats">
        <div><span id="statPosts">0</span> Posts</div>
        <div><span id="statFollowers">0</span> Followers</div>
        <div><span id="statFollowing">0</span> Following</div>
      </div>
    </section>

    <!-- POST BUTTON -->
    <section class="post-section">
      <button id="postBtn" class="post-btn">Post</button>

      <!-- POST DROPDOWN -->
      <div id="postDropdown" class="post-dropdown hidden">
        <button data-type="story">Cloud Story (2 days)</button>
        <button data-type="location-story">Location Story (3 days)</button>
        <button data-type="post">Profile Post</button>
        <button data-type="movie">Movie (Reel)</button>
      </div>
    </section>

    <!-- FEED TOGGLE -->
    <section class="feed-toggle">
      <button id="beltlineFeedBtn" class="feed-btn active">Beltline Feed</button>
      <button id="globalFeedBtn" class="feed-btn">Global Feed</button>
    </section>

    <!-- FEED -->
    <section id="feedContent" class="feed-content">
      <!-- JS loads feed here -->
    </section>

    <!-- MEDIA TABS -->
    <section class="media-tabs">
      <button class="media-tab active" data-tab="videos">Videos</button>
      <button class="media-tab" data-tab="photos">Photos</button>
    </section>

    <!-- MEDIA CONTENT -->
    <section id="mediaContent" class="media-content">
      <!-- JS loads videos/photos here -->
    </section>

  </main>

  <!-- POST EDITOR MODAL -->
  <div id="postEditor" class="modal hidden">
    <div class="modal-box">
      <h2>Create Post</h2>

      <textarea id="editorCaption" placeholder="Write a caption…"></textarea>

      <input type="file" id="editorMedia" accept="image/*,video/*">

      <input id="editorHashtags" placeholder="Hashtags (up to 10)">

      <div class="modal-actions">
        <button id="editorSubmit" class="primary-btn">Post</button>
        <button id="editorCancel" class="secondary-btn">Cancel</button>
      </div>
    </div>
  </div>

  <script type="module" src="/pages/profile/js/profile.js"></script>
</body>
</html>
